name: Apply native Guardian laser correction

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Apply native Guardian correction
        run: python3 tools/apply_native_guardian_fix.py

      - name: Commit native Guardian correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'Onelsey'
          git config user.email '103017546+Wandraker@users.noreply.github.com'
          git add src/main/java/dev/onelsey/incarnate/possession/PossessionSession.java src/main/java/dev/onelsey/incarnate/ability/AbilityRegistry.java README.md CHANGELOG.md
          git commit -m 'Use native Guardian attack goal for laser [skip ci]'
          git push
