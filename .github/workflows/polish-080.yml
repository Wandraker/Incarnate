name: Polish Incarnate 0.8.0

on:
  push:
    branches:
      - dev/0.8.0-body-states
    paths:
      - .github/workflows/polish-080.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.8.0-body-states
          fetch-depth: 0
      - name: Polish source and docs
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          manager = Path('src/main/java/dev/onelsey/incarnate/possession/PossessionManager.java')
          text = manager.read_text()
          text = text.replace('catch (IllegalStateException ignored)', 'catch (IllegalStateException | IllegalArgumentException ignored)')
          text = text.replace('catch (IllegalStateException ex)', 'catch (IllegalStateException | IllegalArgumentException ex)')
          manager.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          marker = '# Changelog\n'
          entry = '\n## 0.8.0 - Body States & Mobility\n\n- Builds directly on the 0.7.1 Dragon/control and Leaf recovery hotfixes.\n- Adds reversible Axolotl `playingDead` possession state with an `F` toggle and movement suppression while playing dead.\n- Adds Fox body-state capture/recovery for crouching, sleeping, interested, leaping, defending and faceplanted states.\n- Adds Fox `Sprint + LMB` pounce and `F` sleep/wake controls with bounded transient state cleanup.\n- Adds Panda body-state capture/recovery for rolling, sneezing and on-back states plus a controlled native roll action on `F`.\n- Deliberately leaves Panda eating untouched because its setter has additional vanilla state/item preconditions and is not treated as unconditionally reversible.\n- Persists the new reversible body-state snapshots through interrupted-session vessel recovery.\n- Hardens all spectator-target camera/release paths for Paper/Leaf implementations that signal invalid spectator state with either `IllegalStateException` or `IllegalArgumentException`.\n- Advances additive configuration schema to 5 without replacing existing user values.\n\n'
          if '## 0.8.0 - Body States & Mobility' not in text:
              if marker not in text:
                  raise SystemExit('missing changelog marker')
              changelog.write_text(text.replace(marker, marker + entry, 1))

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace('## What 0.7.0 implements', '## What 0.8.0 implements', 1)
          section = '### Reversible body states and mobility\n\n0.8.0 expands possession beyond generic movement by preserving more native Mob body state rather than replacing it with synthetic effects.\n\n- Axolotl: `F` toggles the real `playingDead` flag. Controlled movement is suppressed while the body is playing dead.\n- Fox: normal left click remains melee, `Sprint + left click` performs a bounded pounce using the real leaping state and physical velocity, and `F` toggles sleep/wake. Crouching, sleeping, interested, leaping, defending and faceplanted state are captured and restored.\n- Panda: `F` starts a bounded real rolling state with physical motion. Rolling, sneezing and on-back state are captured and restored.\n\nThese states are also written into interrupted-session vessel recovery. Panda eating is intentionally not changed or persisted by Incarnate because the public setter has additional vanilla preconditions; Incarnate avoids claiming exact restoration where it cannot guarantee it.\n\n'
          anchor = '### Movement families\n'
          if section not in text:
              if anchor not in text:
                  raise SystemExit('missing README movement anchor')
              text = text.replace(anchor, section + anchor, 1)
          readme.write_text(text)
          PY
          rm .github/workflows/polish-080.yml
          git config user.name "Onelsey"
          git config user.email "103017546+Wandraker@users.noreply.github.com"
          git add -A
          git commit -m "Polish Incarnate 0.8.0 recovery and documentation"
          git push origin HEAD:dev/0.8.0-body-states
