name: Apply 0.5.0 complex bodies patch

on:
  push:
    branches: [ dev/0.5.0-complex-bodies ]
    paths: [ '.github/workflows/apply-050-complex-bodies.yml' ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev/0.5.0-complex-bodies
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/incarnate.patch
          git apply --check /tmp/incarnate.patch
          git apply /tmp/incarnate.patch
          rm -f .github/workflows/apply-050-complex-bodies.yml
          git config user.name 'Onelsey'
          git config user.email '103017546+Wandraker@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Develop Incarnate 0.5.0 complex bodies'
          git push origin HEAD:dev/0.5.0-complex-bodies
