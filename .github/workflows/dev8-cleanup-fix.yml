name: Dev8 Camera Rig Cleanup Fix

on:
  push:
    branches: [ dev/0.9.0-warden-mob-expansion ]
    paths:
      - '.github/workflows/dev8-cleanup-fix.yml'

permissions:
  contents: write

jobs:
  fix-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: dev/0.9.0-warden-mob-expansion
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Fix normal release rig cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/dev/onelsey/incarnate/possession/PossessionManager.java')
          text = p.read_text(encoding='utf-8')
          start = text.index('    private void restorePlayer(PossessionSession session, ReleaseReason reason, Location vesselLocation) {')
          end = text.index('    private void restorePlayerState(Player player, PlayerState state) {', start)
          block = text[start:end]
          old = '''            if (session.usesDirectEntityCamera()) {
                          directCameraBridge.reset(player);
                      }
                      if (player.isInsideVehicle()) {
          '''
          new = '''            if (session.usesDirectEntityCamera()) {
                          directCameraBridge.reset(player);
                      }
                      if (session.usesCameraRig()) {
                          cameraRigManager.detach(session, player);
                      }
                      if (player.isInsideVehicle()) {
          '''
          if block.count(old) != 1:
              raise SystemExit(f'expected exactly one restorePlayer cleanup target, got {block.count(old)}')
          block = block.replace(old, new)
          p.write_text(text[:start] + block + text[end:], encoding='utf-8')
          PY
          git diff --check
          gradle clean test classes jar --stacktrace --warning-mode all

      - name: Commit clean source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/dev8-cleanup-fix.yml
          git add -A
          git config user.name 'Onelsey'
          git config user.email '103017546+Wandraker@users.noreply.github.com'
          git commit -m 'Fix camera rig cleanup on release'
          git push origin HEAD:dev/0.9.0-warden-mob-expansion
