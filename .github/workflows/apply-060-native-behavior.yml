name: Apply Incarnate 0.6.0 candidate
on:
  push:
    branches:
      - dev/0.6.0-native-behavior
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified 0.6.0 patch
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/incarnate.patch.b64
          printf '%s' '' >> /tmp/incarnate.patch.b64
          printf '%s' '' >> /tmp/incarnate.patch.b64
          printf '%s' '' >> /tmp/incarnate.patch.b64
          base64 -d /tmp/incarnate.patch.b64 > /tmp/incarnate.patch.gz
          echo '4fbb131b037ed298cbc663e1c0696aae833ac8955f015a6575dde49ac3bb340c  /tmp/incarnate.patch.gz' | sha256sum -c -
          gzip -dc /tmp/incarnate.patch.gz > /tmp/incarnate.patch
          git apply --check /tmp/incarnate.patch
          git apply /tmp/incarnate.patch
          rm -f .github/workflows/apply-060-native-behavior.yml
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -Eiq '(^|/)(AI_HANDOVER|EMERGENCY-HANDOVER)|handover'; then echo 'Internal handover file detected'; exit 1; fi
          if git diff --cached | grep -Eiq 'AI_HANDOVER|EMERGENCY-HANDOVER'; then echo 'Internal AI handover text detected'; exit 1; fi
          git config user.name Onelsey
          git config user.email 103017546+Wandraker@users.noreply.github.com
          git commit -m 'Develop Incarnate 0.6.0 native behavior'
          git push origin HEAD:dev/0.6.0-native-behavior
