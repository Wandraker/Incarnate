name: Secondary input stabilization

on:
  push:
    branches:
      - dev/0.8.0-body-states
    paths:
      - .github/workflows/secondary-input-stabilize.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev/0.8.0-body-states
      - name: Apply secondary input transport fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          bridge = Path('src/main/java/dev/onelsey/incarnate/input/SpectatorPrimaryInputBridge.java')
          text = bridge.read_text(encoding='utf-8')
          text = text.replace('    private static final String PACKET_SIMPLE_NAME = "ServerboundSpectatorActionPacket";\n', '    private static final String PACKET_SIMPLE_NAME = "ServerboundSpectatorActionPacket";\n    private static final String PLAYER_ACTION_PACKET_SIMPLE_NAME = "ServerboundPlayerActionPacket";\n    private static final String SWAP_OFFHAND_ACTION = "SWAP_ITEM_WITH_OFFHAND";\n')
          text = text.replace('    private final PrimaryInputDeduplicator deduplicator;\n    private final Consumer<Player> primaryInput;\n', '    private final PrimaryInputDeduplicator deduplicator;\n    private final SecondaryInputDeduplicator secondaryInputDeduplicator;\n    private final Consumer<Player> primaryInput;\n    private final Consumer<Player> secondaryInput;\n')
          old = '        PrimaryInputDeduplicator deduplicator,\n        Consumer<Player> primaryInput\n    ) {\n        this.plugin = plugin;\n        this.deduplicator = deduplicator;\n        this.primaryInput = primaryInput;\n'
          new = '        PrimaryInputDeduplicator deduplicator,\n        SecondaryInputDeduplicator secondaryInputDeduplicator,\n        Consumer<Player> primaryInput,\n        Consumer<Player> secondaryInput\n    ) {\n        this.plugin = plugin;\n        this.deduplicator = deduplicator;\n        this.secondaryInputDeduplicator = secondaryInputDeduplicator;\n        this.primaryInput = primaryInput;\n        this.secondaryInput = secondaryInput;\n'
          if old not in text:
              raise SystemExit('bridge constructor block not found')
          text = text.replace(old, new)
          text = text.replace('        deduplicator.clear(playerId);\n', '        deduplicator.clear(playerId);\n        secondaryInputDeduplicator.clear(playerId);\n', 1)
          old = '                                if (isSpectatorPrimaryAction(message)) {\n                                    deduplicator.markSpectatorPacket(player.getUniqueId(), System.nanoTime());\n                                    dispatchPrimary(player);\n                                }\n'
          new = '                                long nowNanos = System.nanoTime();\n                                if (isSpectatorPrimaryAction(message)) {\n                                    deduplicator.markSpectatorPacket(player.getUniqueId(), nowNanos);\n                                    dispatchPrimary(player);\n                                } else if (isSwapOffhandAction(message)) {\n                                    secondaryInputDeduplicator.markPacket(player.getUniqueId(), nowNanos);\n                                    dispatchSecondary(player);\n                                }\n'
          if old not in text:
              raise SystemExit('bridge packet block not found')
          text = text.replace(old, new)
          old = '    private void dispatchPrimary(Player player) {\n        player.getScheduler().run(plugin, task -> {\n            if (player.isOnline()) {\n                primaryInput.accept(player);\n            }\n        }, null);\n    }\n'
          new = old + '\n    private void dispatchSecondary(Player player) {\n        player.getScheduler().run(plugin, task -> {\n            if (player.isOnline()) {\n                secondaryInput.accept(player);\n            }\n        }, null);\n    }\n'
          if old not in text:
              raise SystemExit('bridge dispatch block not found')
          text = text.replace(old, new)
          old = '    static boolean isSpectatorPrimaryAction(Object packet) {\n        return packet != null && PACKET_SIMPLE_NAME.equals(packet.getClass().getSimpleName());\n    }\n'
          new = old + '\n    static boolean isSwapOffhandAction(Object packet) {\n        if (packet == null || !PLAYER_ACTION_PACKET_SIMPLE_NAME.equals(packet.getClass().getSimpleName())) {\n            return false;\n        }\n        for (Class<?> type = packet.getClass(); type != null; type = type.getSuperclass()) {\n            for (Field field : type.getDeclaredFields()) {\n                if (!field.getType().isEnum() || !field.trySetAccessible()) {\n                    continue;\n                }\n                try {\n                    Object value = field.get(packet);\n                    if (value instanceof Enum<?> action && SWAP_OFFHAND_ACTION.equals(action.name())) {\n                        return true;\n                    }\n                } catch (IllegalAccessException ignored) {\n                }\n            }\n        }\n        return false;\n    }\n'
          if old not in text:
              raise SystemExit('bridge detector block not found')
          bridge.write_text(text.replace(old, new), encoding='utf-8')

          bridge_test = Path('src/test/java/dev/onelsey/incarnate/input/SpectatorPrimaryInputBridgeTest.java')
          test = bridge_test.read_text(encoding='utf-8')
          marker = '    @Test\n    void ignoresUnrelatedPackets() {'
          insert = '    @Test\n    void detectsSwapOffhandPlayerAction() {\n        assertTrue(SpectatorPrimaryInputBridge.isSwapOffhandAction(\n            new ServerboundPlayerActionPacket(PlayerAction.SWAP_ITEM_WITH_OFFHAND)\n        ));\n    }\n\n    @Test\n    void ignoresOtherPlayerActions() {\n        assertFalse(SpectatorPrimaryInputBridge.isSwapOffhandAction(\n            new ServerboundPlayerActionPacket(PlayerAction.DROP_ITEM)\n        ));\n    }\n\n'
          if marker not in test:
              raise SystemExit('bridge test marker not found')
          test = test.replace(marker, insert + marker)
          tail = '    private static final class ServerboundSpectatorActionPacket {\n        private final OptionalInt entityId;\n\n        private ServerboundSpectatorActionPacket(OptionalInt entityId) {\n            this.entityId = entityId;\n        }\n    }\n'
          extra = '\n    private enum PlayerAction {\n        SWAP_ITEM_WITH_OFFHAND,\n        DROP_ITEM\n    }\n\n    private static final class ServerboundPlayerActionPacket {\n        private final PlayerAction action;\n\n        private ServerboundPlayerActionPacket(PlayerAction action) {\n            this.action = action;\n        }\n    }\n'
          if tail not in test:
              raise SystemExit('bridge test tail not found')
          bridge_test.write_text(test.replace(tail, tail + extra), encoding='utf-8')

          listener = Path('src/main/java/dev/onelsey/incarnate/listener/SessionListener.java')
          text = listener.read_text(encoding='utf-8')
          text = text.replace('import dev.onelsey.incarnate.input.PrimaryInputTransport;\n', 'import dev.onelsey.incarnate.input.PrimaryInputTransport;\nimport dev.onelsey.incarnate.input.SecondaryInputDeduplicator;\nimport dev.onelsey.incarnate.input.SecondaryInputTransport;\n')
          text = text.replace('    private final PrimaryInputDeduplicator primaryInputDeduplicator;\n', '    private final PrimaryInputDeduplicator primaryInputDeduplicator;\n    private final SecondaryInputDeduplicator secondaryInputDeduplicator;\n')
          old = '        PossessionManager possessions,\n        PrimaryInputDeduplicator primaryInputDeduplicator\n    ) {\n        this.possessions = possessions;\n        this.primaryInputDeduplicator = primaryInputDeduplicator;\n'
          new = '        PossessionManager possessions,\n        PrimaryInputDeduplicator primaryInputDeduplicator,\n        SecondaryInputDeduplicator secondaryInputDeduplicator\n    ) {\n        this.possessions = possessions;\n        this.primaryInputDeduplicator = primaryInputDeduplicator;\n        this.secondaryInputDeduplicator = secondaryInputDeduplicator;\n'
          if old not in text:
              raise SystemExit('listener constructor block not found')
          text = text.replace(old, new)
          old = '    @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = false)\n    public void onSwap(PlayerSwapHandItemsEvent event) {\n        PossessionSession session = possessions.session(event.getPlayer());\n        if (session == null || !session.isActive()) {\n            return;\n        }\n\n        boolean sneak = session.input().sneak()\n            || event.getPlayer().isSneaking()\n            || session.hasRecentSpectatorShiftAttempt(spectatorShiftLatchNanos);\n\n        if (releaseHotkey && sneak) {\n            event.setCancelled(true);\n            possessions.requestRelease(session, ReleaseReason.HOTKEY);\n            return;\n        }\n\n        if (secondaryHotkey) {\n            event.setCancelled(true);\n            possessions.triggerSecondary(event.getPlayer());\n        }\n    }\n'
          new = '    @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = false)\n    public void onSwap(PlayerSwapHandItemsEvent event) {\n        PossessionSession session = possessions.session(event.getPlayer());\n        if (session == null || !session.isActive()) {\n            return;\n        }\n        event.setCancelled(true);\n        triggerSwapFromTransport(event.getPlayer(), SecondaryInputTransport.BUKKIT_SWAP);\n    }\n\n    public void triggerSwapFromPacket(Player player) {\n        triggerSwapFromTransport(player, SecondaryInputTransport.PLAYER_ACTION_PACKET);\n    }\n\n    private void triggerSwapFromTransport(Player player, SecondaryInputTransport transport) {\n        PossessionSession session = possessions.session(player);\n        if (session == null || !session.isActive()) {\n            return;\n        }\n        if (!secondaryInputDeduplicator.accept(player.getUniqueId(), transport, System.nanoTime())) {\n            return;\n        }\n\n        boolean sneak = session.input().sneak()\n            || player.isSneaking()\n            || session.hasRecentSpectatorShiftAttempt(spectatorShiftLatchNanos);\n\n        if (releaseHotkey && sneak) {\n            possessions.requestRelease(session, ReleaseReason.HOTKEY);\n            return;\n        }\n\n        if (secondaryHotkey) {\n            possessions.triggerSecondary(player);\n        }\n    }\n'
          if old not in text:
              raise SystemExit('listener swap block not found')
          text = text.replace(old, new)
          text = text.replace('        primaryInputDeduplicator.clear(event.getPlayer().getUniqueId());\n        possessions.releaseOnQuit', '        primaryInputDeduplicator.clear(event.getPlayer().getUniqueId());\n        secondaryInputDeduplicator.clear(event.getPlayer().getUniqueId());\n        possessions.releaseOnQuit')
          listener.write_text(text, encoding='utf-8')

          plugin = Path('src/main/java/dev/onelsey/incarnate/IncarnatePlugin.java')
          text = plugin.read_text(encoding='utf-8')
          text = text.replace('import dev.onelsey.incarnate.input.PrimaryInputDeduplicator;\n', 'import dev.onelsey.incarnate.input.PrimaryInputDeduplicator;\nimport dev.onelsey.incarnate.input.SecondaryInputDeduplicator;\n')
          old = '        PrimaryInputDeduplicator primaryInputDeduplicator = new PrimaryInputDeduplicator();\n        SessionListener sessionListener = new SessionListener(this, possessions, primaryInputDeduplicator);\n'
          new = '        PrimaryInputDeduplicator primaryInputDeduplicator = new PrimaryInputDeduplicator();\n        SecondaryInputDeduplicator secondaryInputDeduplicator = new SecondaryInputDeduplicator();\n        SessionListener sessionListener = new SessionListener(\n            this,\n            possessions,\n            primaryInputDeduplicator,\n            secondaryInputDeduplicator\n        );\n'
          if old not in text:
              raise SystemExit('plugin listener block not found')
          text = text.replace(old, new)
          old = '            this,\n            primaryInputDeduplicator,\n            sessionListener::triggerPrimaryFromPacket\n        );\n'
          new = '            this,\n            primaryInputDeduplicator,\n            secondaryInputDeduplicator,\n            sessionListener::triggerPrimaryFromPacket,\n            sessionListener::triggerSwapFromPacket\n        );\n'
          if old not in text:
              raise SystemExit('plugin bridge block not found')
          plugin.write_text(text.replace(old, new), encoding='utf-8')

          build = Path('build.gradle.kts')
          text = build.read_text(encoding='utf-8')
          if 'version = "0.8.1-alpha.3"' not in text:
              raise SystemExit('build version not found')
          build.write_text(text.replace('version = "0.8.1-alpha.3"', 'version = "0.8.1-alpha.4"'), encoding='utf-8')

          plugin_yml = Path('src/main/resources/plugin.yml')
          text = plugin_yml.read_text(encoding='utf-8')
          if 'version: 0.8.1-alpha.3' not in text:
              raise SystemExit('plugin version not found')
          plugin_yml.write_text(text.replace('version: 0.8.1-alpha.3', 'version: 0.8.1-alpha.4'), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          header = '# Changelog\n\n'
          entry = '## 0.8.1-alpha.4 - Spectator Secondary Input\n\n- Restores the swap-offhand (`F`) input path while the hidden possession controller is in spectator mode.\n- Observes `ServerboundPlayerActionPacket` with `SWAP_ITEM_WITH_OFFHAND` before vanilla spectator handling and hands the pulse back to the Player EntityScheduler.\n- Keeps `F` as the configured secondary action and preserves `Shift + F` as the emergency release gesture; no control remapping is introduced.\n- Adds packet/Bukkit deduplication so one physical `F` press cannot execute a secondary ability twice on forks that also emit `PlayerSwapHandItemsEvent`.\n- Keeps the Bukkit swap event as a compatibility fallback and continues cancelling the hidden controller inventory swap during an active possession.\n- Adds regression coverage for swap-offhand packet recognition, unrelated player-action rejection, deduplication and fallback behavior.\n- Retains the live-confirmed 0.8.1-alpha.2 LMB transport fix and 0.8.1-alpha.3 primary-input deduplication.\n\n'
          if not text.startswith(header):
              raise SystemExit('unexpected changelog header')
          changelog.write_text(header + entry + text[len(header):], encoding='utf-8')

          Path('.github/workflows/secondary-input-stabilize.yml').unlink()
          PY
          git config user.name Onelsey
          git config user.email 103017546+Wandraker@users.noreply.github.com
          git add -A
          git commit -m "Restore spectator secondary input transport"
          git push origin HEAD:dev/0.8.0-body-states
