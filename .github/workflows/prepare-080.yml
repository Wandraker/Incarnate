name: Prepare Incarnate 0.8.0 body states

on:
  workflow_dispatch:
  push:
    branches:
      - dev/0.8.0-body-states
    paths:
      - .github/workflows/prepare-080.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.8.0-body-states
          fetch-depth: 0
      - name: Apply 0.8.0 body-state milestone
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:80]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"non-unique patch anchor in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          path = "src/main/java/dev/onelsey/incarnate/possession/VesselState.java"
