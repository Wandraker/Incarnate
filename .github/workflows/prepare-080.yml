          patch(path,
              "            shulkerAttachedFace,\n            frogTongueTarget,\n            snifferState\n        );",
              "            shulkerAttachedFace,\n            frogTongueTarget,\n            snifferState,\n            axolotlPlayingDead,\n            foxBodyState,\n            pandaBodyState\n        );")
