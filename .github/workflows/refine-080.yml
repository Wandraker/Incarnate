name: Refine Incarnate 0.8.0 body-state control

on:
  push:
    branches:
      - dev/0.8.0-body-states
    paths:
      - .github/workflows/refine-080.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.8.0-body-states
          fetch-depth: 0
      - name: Refine controlled body states
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:120]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"non-unique patch anchor in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          path = "src/main/java/dev/onelsey/incarnate/possession/PossessionSession.java"
          patch(path,
              "    private volatile long foxPounceUntilTick = Long.MIN_VALUE;\n    private volatile long pandaRollUntilTick = Long.MIN_VALUE;\n    private volatile long lastSpectatorShiftAttemptNanos = Long.MIN_VALUE;",
              "    private volatile long foxPounceUntilTick = Long.MIN_VALUE;\n    private volatile long pandaRollUntilTick = Long.MIN_VALUE;\n    private volatile boolean axolotlPlayingDeadControlled;\n    private volatile boolean foxSleepingControlled;\n    private volatile long lastSpectatorShiftAttemptNanos = Long.MIN_VALUE;")
          patch(path,
              "    public void startPandaRoll(int ticks) { pandaRollUntilTick = controlTick + Math.max(1, ticks); }\n    public boolean pandaRollTracked() { return pandaRollUntilTick != Long.MIN_VALUE; }\n    public boolean pandaRollExpired() { return pandaRollTracked() && controlTick > pandaRollUntilTick; }\n    public void clearPandaRoll() { pandaRollUntilTick = Long.MIN_VALUE; }\n\n    public void markSpectatorShiftAttempt() {",
              "    public void startPandaRoll(int ticks) { pandaRollUntilTick = controlTick + Math.max(1, ticks); }\n    public boolean pandaRollTracked() { return pandaRollUntilTick != Long.MIN_VALUE; }\n    public boolean pandaRollExpired() { return pandaRollTracked() && controlTick > pandaRollUntilTick; }\n    public void clearPandaRoll() { pandaRollUntilTick = Long.MIN_VALUE; }\n\n    public boolean axolotlPlayingDeadControlled() { return axolotlPlayingDeadControlled; }\n    public void axolotlPlayingDeadControlled(boolean value) { axolotlPlayingDeadControlled = value; }\n    public boolean foxSleepingControlled() { return foxSleepingControlled; }\n    public void foxSleepingControlled(boolean value) { foxSleepingControlled = value; }\n\n    public void markSpectatorShiftAttempt() {")

          path = "src/main/java/dev/onelsey/incarnate/ability/AbilityRegistry.java"
          patch(path,
              "        if (vessel instanceof Axolotl axolotl && axolotl.isPlayingDead()) {\n            return false;\n        }\n        if (vessel instanceof Fox fox && fox.isSleeping()) {\n            return false;\n        }",
              "        if (vessel instanceof Axolotl axolotl && (session.axolotlPlayingDeadControlled() || axolotl.isPlayingDead())) {\n            return false;\n        }\n        if (vessel instanceof Fox fox && (session.foxSleepingControlled() || fox.isSleeping())) {\n            return false;\n        }")
          patch(path,
              "        if (vessel instanceof Guardian guardian) {\n            tickGuardianLaser(session, guardian);\n        }",
              "        if (vessel instanceof Axolotl axolotl) {\n            maintainAxolotlPlayDead(session, axolotl);\n        }\n        if (vessel instanceof Fox fox) {\n            maintainFoxSleep(session, fox);\n        }\n        if (vessel instanceof Guardian guardian) {\n            tickGuardianLaser(session, guardian);\n        }")
          patch(path,
              "    private boolean toggleAxolotlPlayDead(PossessionSession session, Axolotl axolotl) {\n        if (!session.acquireSecondaryCooldown(axolotlPlayDeadCooldownTicks)) return false;\n        boolean playingDead = !axolotl.isPlayingDead();\n        axolotl.setPlayingDead(playingDead);\n        if (playingDead) axolotl.setVelocity(new Vector());\n        return true;\n    }",
              "    private boolean toggleAxolotlPlayDead(PossessionSession session, Axolotl axolotl) {\n        if (!session.acquireSecondaryCooldown(axolotlPlayDeadCooldownTicks)) return false;\n        boolean playingDead = !session.axolotlPlayingDeadControlled();\n        axolotl.setPlayingDead(playingDead);\n        session.axolotlPlayingDeadControlled(playingDead);\n        if (playingDead) axolotl.setVelocity(new Vector());\n        return true;\n    }\n\n    private static void maintainAxolotlPlayDead(PossessionSession session, Axolotl axolotl) {\n        boolean expected = session.axolotlPlayingDeadControlled();\n        if (axolotl.isPlayingDead() != expected) {\n            axolotl.setPlayingDead(expected);\n        }\n    }")
          patch(path,
              "    private boolean toggleFoxSleep(PossessionSession session, Fox fox) {\n        if (!session.acquireSecondaryCooldown(foxSleepCooldownTicks)) return false;\n        if (session.foxPounceTracked()) { fox.setLeaping(false); session.clearFoxPounce(); }\n        boolean sleeping = !fox.isSleeping();\n        fox.setCrouching(false);\n        fox.setInterested(false);\n        fox.setFaceplanted(false);\n        fox.setSleeping(sleeping);\n        if (sleeping) fox.setVelocity(new Vector());\n        return true;\n    }",
              "    private boolean toggleFoxSleep(PossessionSession session, Fox fox) {\n        if (!session.acquireSecondaryCooldown(foxSleepCooldownTicks)) return false;\n        if (session.foxPounceTracked()) { fox.setLeaping(false); session.clearFoxPounce(); }\n        boolean sleeping = !session.foxSleepingControlled();\n        fox.setCrouching(false);\n        fox.setInterested(false);\n        fox.setFaceplanted(false);\n        fox.setSleeping(sleeping);\n        session.foxSleepingControlled(sleeping);\n        if (sleeping) fox.setVelocity(new Vector());\n        return true;\n    }\n\n    private static void maintainFoxSleep(PossessionSession session, Fox fox) {\n        boolean expected = session.foxSleepingControlled();\n        if (fox.isSleeping() != expected) {\n            fox.setSleeping(expected);\n        }\n    }")
          patch(path,
              "        if (fox.isSleeping() || !fox.isOnGround() || session.foxPounceTracked()) return false;",
              "        if (session.foxSleepingControlled() || fox.isSleeping() || !fox.isOnGround() || session.foxPounceTracked()) return false;")
          patch(path,
              "    private void tickFoxPounce(PossessionSession session, Fox fox) {\n        if (session.foxPounceTracked() && session.foxPounceExpired()) {\n            fox.setLeaping(false);\n            session.clearFoxPounce();\n        }\n    }",
              "    private void tickFoxPounce(PossessionSession session, Fox fox) {\n        if (!session.foxPounceTracked()) return;\n        if (session.foxPounceExpired()) {\n            fox.setLeaping(false);\n            session.clearFoxPounce();\n            return;\n        }\n        if (!fox.isLeaping()) {\n            fox.setLeaping(true);\n        }\n    }")
          patch(path,
              "    private void tickPandaRoll(PossessionSession session, Panda panda) {\n        if (session.pandaRollTracked() && session.pandaRollExpired()) {\n            panda.setRolling(false);\n            session.clearPandaRoll();\n        }\n    }",
              "    private void tickPandaRoll(PossessionSession session, Panda panda) {\n        if (!session.pandaRollTracked()) return;\n        if (session.pandaRollExpired()) {\n            panda.setRolling(false);\n            session.clearPandaRoll();\n            return;\n        }\n        if (!panda.isRolling()) {\n            panda.setRolling(true);\n        }\n    }")

          path = "src/main/java/dev/onelsey/incarnate/possession/PossessionManager.java"
          patch(path,
              "                if (bodyStateLocksMovement(vessel)) {",
              "                if (bodyStateLocksMovement(session, vessel)) {")
          patch(path,
              "    private static boolean bodyStateLocksMovement(Mob vessel) {\n        return vessel instanceof Axolotl axolotl && axolotl.isPlayingDead()\n            || vessel instanceof Fox fox && fox.isSleeping();\n    }",
              "    private static boolean bodyStateLocksMovement(PossessionSession session, Mob vessel) {\n        return vessel instanceof Axolotl axolotl && (session.axolotlPlayingDeadControlled() || axolotl.isPlayingDead())\n            || vessel instanceof Fox fox && (session.foxSleepingControlled() || fox.isSleeping());\n    }")
          PY
          ./gradlew test build --no-daemon
          rm .github/workflows/refine-080.yml
          git config user.name "Onelsey"
          git config user.email "103017546+Wandraker@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize controlled body states in 0.8.0"
          git push origin HEAD:dev/0.8.0-body-states