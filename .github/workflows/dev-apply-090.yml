name: Incarnate 0.9 development patch

on:
  push:
    branches:
      - dev/0.9.0-warden-mob-expansion
    paths:
      - .github/workflows/dev-apply-090.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: dev/0.9.0-warden-mob-expansion
          fetch-depth: 0
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'
      - name: Apply source changes
        shell: bash
        run: |
          echo '
...<base64 omitted in summary for brevity>...' | base64 -d > /tmp/incarnate_patch.py
          python3 /tmp/incarnate_patch.py
      - name: Verify Java 25 build
        run: gradle clean test classes --stacktrace --warning-mode all
      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/dev-apply-090.yml
          git config user.name Onelsey
          git config user.email 103017546+Wandraker@users.noreply.github.com
          git add -A
          git commit -m "Add Warden sonic control and Ghast attack fidelity"
          git push origin HEAD:dev/0.9.0-warden-mob-expansion
