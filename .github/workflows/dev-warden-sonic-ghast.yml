        wardenSonicTargetId = targetId;
        wardenSonicFireTick = controlTick + Math.max(1, chargeTicks);
    }

    public boolean wardenSonicTracked() { return wardenSonicFireTick != Long.MIN_VALUE && wardenSonicTargetId != null; }
