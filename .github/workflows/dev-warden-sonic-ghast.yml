name: Warden sonic and Ghast fidelity

on:
  push:
    branches:
      - dev/0.9.0-warden-mob-expansion
    paths:
      - .github/workflows/dev-warden-sonic-ghast.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev/0.9.0-warden-mob-expansion
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Apply development patch
