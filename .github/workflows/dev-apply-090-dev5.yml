name: Apply Incarnate 0.9 dev5 mounted input fix

on:
  push:
    branches:
      - dev/0.9.0-warden-mob-expansion
    paths:
      - .github/workflows/dev-apply-090-dev5.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'
      - name: Apply dev5 changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {text.count(old)}')
              write(path, text.replace(old, new, 1))

          replace_once('build.gradle.kts', 'version = "0.9.0-dev.4"', 'version = "0.9.0-dev.5"')
          replace_once('src/main/resources/plugin.yml', 'version: 0.9.0-dev.4', 'version: 0.9.0-dev.5')
          replace_once('src/main/java/dev/onelsey/incarnate/config/ConfigMigrator.java', 'private static final int CURRENT_SCHEMA = 8;', 'private static final int CURRENT_SCHEMA = 9;')
          replace_once('src/main/resources/config.yml', 'config-version: 8', 'config-version: 9')
          replace_once('src/main/resources/config.yml', 'camera:\n  mode: MOUNTED\n', 'camera:\n  mode: MOUNTED\n  mounted-client-game-mode: ADVENTURE\n')

          config_test = read('src/test/java/dev/onelsey/incarnate/config/ConfigMigratorTest.java')
          config_test = config_test.replace('defaults.set("config-version", 8);', 'defaults.set("config-version", 9);')
          config_test = config_test.replace('user.set("config-version", 8);', 'user.set("config-version", 9);')
          config_test = config_test.replace('assertEquals(8, user.getInt("config-version"));', 'assertEquals(9, user.getInt("config-version"));')
          write('src/test/java/dev/onelsey/incarnate/config/ConfigMigratorTest.java', config_test)

          replace_once(
              'src/test/java/dev/onelsey/incarnate/message/MessageResourcesTest.java',
              'assertEquals(8, config.getInt("config-version"));',
              'assertEquals(9, config.getInt("config-version"));\n        assertEquals("ADVENTURE", config.getString("camera.mounted-client-game-mode"));'
          )

          manager = read('src/main/java/dev/onelsey/incarnate/possession/PossessionManager.java')
          old = '    private final boolean cameraFallbackToSpectatorTarget;\n    private final boolean hudEnabled;'
          new = '    private final boolean cameraFallbackToSpectatorTarget;\n    private final ClientGameModeBridge clientGameModeBridge;\n    private final boolean hudEnabled;'
          if manager.count(old) != 1:
              raise SystemExit('PossessionManager field anchor mismatch')
          manager = manager.replace(old, new, 1)

          old = '        this.cameraMountRetries = Math.max(1, plugin.getConfig().getInt("camera.mount-retries", 8));\n        this.cameraFallbackToSpectatorTarget = plugin.getConfig().getBoolean("camera.fallback-to-spectator-target", true);\n        this.hudEnabled = plugin.getConfig().getBoolean("hud.actionbar.enabled", true);'
          new = '        this.cameraMountRetries = Math.max(1, plugin.getConfig().getInt("camera.mount-retries", 8));\n        this.cameraFallbackToSpectatorTarget = plugin.getConfig().getBoolean("camera.fallback-to-spectator-target", true);\n        this.clientGameModeBridge = new ClientGameModeBridge(plugin);\n        this.hudEnabled = plugin.getConfig().getBoolean("hud.actionbar.enabled", true);'
          if manager.count(old) != 1:
              raise SystemExit('PossessionManager constructor anchor mismatch')
          manager = manager.replace(old, new, 1)

          old = '            session.cameraTransport(CameraTransport.MOUNTED);\n            if (session.vesselType() == EntityType.ENDER_DRAGON) {'
          new = '            session.cameraTransport(CameraTransport.MOUNTED);\n            clientGameModeBridge.presentMounted(player);\n            if (session.vesselType() == EntityType.ENDER_DRAGON) {'
          if manager.count(old) != 1:
              raise SystemExit('PossessionManager mounted anchor mismatch')
          manager = manager.replace(old, new, 1)

          old = '            session.cameraTransport(CameraTransport.SPECTATOR_TARGET);\n            try {'
          new = '            clientGameModeBridge.present(player, GameMode.SPECTATOR);\n            session.cameraTransport(CameraTransport.SPECTATOR_TARGET);\n            try {'
          if manager.count(old) != 1:
              raise SystemExit('PossessionManager spectator target anchor mismatch')
          manager = manager.replace(old, new, 1)

          old = '    private static void restorePlayerState(Player player, PlayerState state) {\n        player.setGameMode(state.gameMode());\n        player.setAllowFlight(state.allowFlight());\n        player.setFlySpeed(state.flySpeed());\n        player.setFlying(state.allowFlight() && state.flying());\n    }'
          new = '    private void restorePlayerState(Player player, PlayerState state) {\n        player.setGameMode(state.gameMode());\n        player.setAllowFlight(state.allowFlight());\n        player.setFlySpeed(state.flySpeed());\n        player.setFlying(state.allowFlight() && state.flying());\n        clientGameModeBridge.present(player, state.gameMode());\n    }'
          if manager.count(old) != 1:
              raise SystemExit('PossessionManager restore anchor mismatch')
          manager = manager.replace(old, new, 1)
          write('src/main/java/dev/onelsey/incarnate/possession/PossessionManager.java', manager)

          listener = read('src/main/java/dev/onelsey/incarnate/listener/SessionListener.java')
          old = '        if (event.getDismounted().getUniqueId().equals(session.vesselId()) && event.isCancellable()) {\n            event.setCancelled(true);\n        }'
          new = '        if (event.getDismounted().getUniqueId().equals(session.vesselId()) && event.isCancellable()) {\n            session.markSpectatorShiftAttempt();\n            event.setCancelled(true);\n        }'
          if listener.count(old) != 1:
              raise SystemExit('SessionListener dismount anchor mismatch')
          write('src/main/java/dev/onelsey/incarnate/listener/SessionListener.java', listener.replace(old, new, 1))

          bridge = '''package dev.onelsey.incarnate.possession;

import dev.onelsey.incarnate.IncarnatePlugin;
import org.bukkit.GameMode;
import org.bukkit.entity.Player;

import java.lang.reflect.Constructor;
import java.lang.reflect.Field;
import java.lang.reflect.Method;
import java.util.Locale;
import java.util.concurrent.atomic.AtomicBoolean;

public final class ClientGameModeBridge {
    private static final String GAME_EVENT_PACKET = "net.minecraft.network.protocol.game.ClientboundGameEventPacket";
    private static final String CHANGE_GAME_MODE = "CHANGE_GAME_MODE";

    private final IncarnatePlugin plugin;
    private final GameMode mountedClientMode;
    private final AtomicBoolean warnedUnavailable = new AtomicBoolean(false);

    public ClientGameModeBridge(IncarnatePlugin plugin) {
        this.plugin = plugin;
        this.mountedClientMode = readMountedClientMode(plugin);
    }

    public void presentMounted(Player player) {
        present(player, mountedClientMode);
    }

    public void present(Player player, GameMode mode) {
        if (player == null || mode == null || !player.isOnline()) {
            return;
        }
        try {
            sendClientGameMode(player, mode);
        } catch (Throwable ex) {
            warnUnavailable(ex);
        }
    }

    static float protocolValue(GameMode mode) {
        return switch (mode) {
            case SURVIVAL -> 0.0F;
            case CREATIVE -> 1.0F;
            case ADVENTURE -> 2.0F;
            case SPECTATOR -> 3.0F;
        };
    }

    private static GameMode readMountedClientMode(IncarnatePlugin plugin) {
        String raw = plugin.getConfig().getString("camera.mounted-client-game-mode", "ADVENTURE");
        GameMode mode;
        try {
            mode = GameMode.valueOf(raw == null ? "ADVENTURE" : raw.trim().toUpperCase(Locale.ROOT));
        } catch (IllegalArgumentException ex) {
            plugin.getLogger().warning("Unknown camera.mounted-client-game-mode; using ADVENTURE.");
            return GameMode.ADVENTURE;
        }
        if (mode == GameMode.SPECTATOR) {
            plugin.getLogger().warning("camera.mounted-client-game-mode=SPECTATOR disables vanilla F/sprint input; using ADVENTURE.");
            return GameMode.ADVENTURE;
        }
        return mode;
    }

    private static void sendClientGameMode(Player player, GameMode mode) throws ReflectiveOperationException {
        Method getHandle = player.getClass().getMethod("getHandle");
        Object serverPlayer = getHandle.invoke(player);
        Object packetListener = readField(serverPlayer, "connection");

        ClassLoader loader = serverPlayer.getClass().getClassLoader();
        Class<?> packetClass = Class.forName(GAME_EVENT_PACKET, true, loader);
        Field changeModeField = packetClass.getField(CHANGE_GAME_MODE);
        Object changeModeType = changeModeField.get(null);
        Object packet = createPacket(packetClass, changeModeType, protocolValue(mode));
        invokeSend(packetListener, packet);
    }

    private static Object createPacket(Class<?> packetClass, Object changeModeType, float value) throws ReflectiveOperationException {
        for (Constructor<?> constructor : packetClass.getDeclaredConstructors()) {
            Class<?>[] parameters = constructor.getParameterTypes();
            if (parameters.length != 2
                || !parameters[0].isInstance(changeModeType)
                || parameters[1] != float.class
                || !constructor.trySetAccessible()) {
                continue;
            }
            return constructor.newInstance(changeModeType, value);
        }
        throw new NoSuchMethodException(packetClass.getName() + "(Type,float)");
    }

    private static void invokeSend(Object packetListener, Object packet) throws ReflectiveOperationException {
        for (Method method : packetListener.getClass().getMethods()) {
            Class<?>[] parameters = method.getParameterTypes();
            if (method.getName().equals("send")
                && parameters.length == 1
                && parameters[0].isAssignableFrom(packet.getClass())) {
                method.invoke(packetListener, packet);
                return;
            }
        }
        for (Class<?> type = packetListener.getClass(); type != null; type = type.getSuperclass()) {
            for (Method method : type.getDeclaredMethods()) {
                Class<?>[] parameters = method.getParameterTypes();
                if (!method.getName().equals("send")
                    || parameters.length != 1
                    || !parameters[0].isAssignableFrom(packet.getClass())
                    || !method.trySetAccessible()) {
                    continue;
                }
                method.invoke(packetListener, packet);
                return;
            }
        }
        throw new NoSuchMethodException(packetListener.getClass().getName() + "#send(Packet)");
    }

    private static Object readField(Object owner, String name) throws ReflectiveOperationException {
        if (owner == null) {
            throw new NoSuchFieldException(name);
        }
        for (Class<?> type = owner.getClass(); type != null; type = type.getSuperclass()) {
            try {
                Field field = type.getDeclaredField(name);
                if (!field.trySetAccessible()) {
                    throw new IllegalAccessException(type.getName() + '#' + name);
                }
                return field.get(owner);
            } catch (NoSuchFieldException ignored) {
            }
        }
        throw new NoSuchFieldException(owner.getClass().getName() + '#' + name);
    }

    private void warnUnavailable(Throwable throwable) {
        if (!warnedUnavailable.compareAndSet(false, true)) {
            return;
        }
        plugin.getLogger().log(
            java.util.logging.Level.WARNING,
            "Mounted client input mode could not be presented. The server remains safe in spectator mode, but vanilla F/sprint input may be unavailable.",
            throwable
        );
    }
}
'''
          write('src/main/java/dev/onelsey/incarnate/possession/ClientGameModeBridge.java', bridge)

          test = '''package dev.onelsey.incarnate.possession;

import org.bukkit.GameMode;
import org.junit.jupiter.api.Test;

import static org.junit.jupiter.api.Assertions.assertEquals;

class ClientGameModeBridgeTest {
    @Test
    void mapsVanillaGameModeProtocolValues() {
        assertEquals(0.0F, ClientGameModeBridge.protocolValue(GameMode.SURVIVAL));
        assertEquals(1.0F, ClientGameModeBridge.protocolValue(GameMode.CREATIVE));
        assertEquals(2.0F, ClientGameModeBridge.protocolValue(GameMode.ADVENTURE));
        assertEquals(3.0F, ClientGameModeBridge.protocolValue(GameMode.SPECTATOR));
    }
}
'''
          write('src/test/java/dev/onelsey/incarnate/possession/ClientGameModeBridgeTest.java', test)

          changelog = read('CHANGELOG.md')
          marker = '# Changelog\n\n'
          if not changelog.startswith(marker):
              raise SystemExit('CHANGELOG header mismatch')
          section = '''## 0.9.0-dev.5 - Mounted Vanilla Input Recovery

- Fixes the root cause of dead `F` / `Shift + F` controls in the default mounted camera: the server still keeps the controller in spectator mode for safety, while the client is presented as Adventure during a successful mounted possession so vanilla emits ordinary swap-offhand and sprint input again.
- Restores the real client game mode whenever possession ends and explicitly returns the client to Spectator when the legacy spectator-target camera is used.
- Records cancelled mounted dismount attempts as a short Shift latch, making `Shift + F` release reliable even when the F packet and sneak state arrive on adjacent ticks.
- Keeps existing left-click abilities and the server-side spectator safety model unchanged.
- Adds `camera.mounted-client-game-mode`, defaulting to `ADVENTURE`; `SPECTATOR` is rejected because it suppresses the vanilla input this bridge exists to recover.
- Advances gameplay config schema to 9 additively; existing values remain preserved.

'''
          write('CHANGELOG.md', marker + section + changelog[len(marker):])
          PY
      - name: Verify Java 25 build
        run: gradle clean test classes jar --stacktrace --warning-mode all
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name Onelsey
          git config user.email 103017546+Wandraker@users.noreply.github.com
          git add build.gradle.kts CHANGELOG.md src/main
          git add src/test
          git commit -m "Recover mounted F and sprint input"
          git push origin HEAD:dev/0.9.0-warden-mob-expansion