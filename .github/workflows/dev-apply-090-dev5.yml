name: Apply Incarnate 0.9 dev5 mounted input fix

on:
  push:
    branches:
      - dev/0.9.0-warden-mob-expansion
    paths:
      - .github/workflows/dev-apply-090-dev5.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'
      - name: Apply dev5 changes
        run: python3 .github/scripts/apply_090_dev5.py
      - name: Verify Java 25 build
        run: gradle clean test classes jar --stacktrace --warning-mode all
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name Onelsey
          git config user.email 103017546+Wandraker@users.noreply.github.com
          git add build.gradle.kts CHANGELOG.md src/main src/test
          git commit -m "Recover mounted F and sprint input"
          git push origin HEAD:dev/0.9.0-warden-mob-expansion