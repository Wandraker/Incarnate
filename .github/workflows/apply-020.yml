name: Apply Incarnate 0.2.0

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Apply 0.2.0 patch
        run: python3 tools/apply_020.py

      - name: Commit 0.2.0
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'Onelsey'
          git config user.email '103017546+Wandraker@users.noreply.github.com'
          git add build.gradle.kts README.md CHANGELOG.md src/main
          git commit -m 'Develop Incarnate 0.2.0 Native Abilities Update [skip ci]'
          git push
