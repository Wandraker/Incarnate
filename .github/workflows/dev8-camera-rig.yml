name: Dev8 Camera Rig Patch

on:
  push:
    branches: [ dev/0.9.0-warden-mob-expansion ]
    paths:
      - '.github/scripts/apply_090_dev8.py'
      - '.github/workflows/dev8-camera-rig.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: dev/0.9.0-warden-mob-expansion
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Apply dev.8 patch
        run: python .github/scripts/apply_090_dev8.py

      - name: Validate
        run: |
          git diff --check
          gradle clean test classes jar --stacktrace --warning-mode all

      - name: Commit clean source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/apply_090_dev8.py .github/workflows/dev8-camera-rig.yml
          rmdir .github/scripts 2>/dev/null || true
          git add -A
          git config user.name 'Onelsey'
          git config user.email '103017546+Wandraker@users.noreply.github.com'
          git commit -m 'Use anchored camera rig for possession'
          git push origin HEAD:dev/0.9.0-warden-mob-expansion
