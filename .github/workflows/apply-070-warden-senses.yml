name: Apply Incarnate 0.7.0 candidate
on:
  push:
    paths:
      - '.github/workflows/apply-070-warden-senses.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.7.0-warden-senses
      - name: Apply verified 0.7.0 patch
        shell: bash
        run: |
          cat > /tmp/incarnate.patch.b64 <<'EOF'
          
          
          EOF
          tr -d '[:space:]' < /tmp/incarnate.patch.b64 | base64 --decode | gzip --decompress > /tmp/incarnate.patch
          git apply --check /tmp/incarnate.patch
          git apply /tmp/incarnate.patch
          rm .github/workflows/apply-070-warden-senses.yml
          git add -A
          git diff --cached --check
          git config user.name 'Onelsey'
          git config user.email '103017546+Wandraker@users.noreply.github.com'
          git commit -m 'Develop Incarnate 0.7.0 Warden senses'
          git push origin HEAD:dev/0.7.0-warden-senses
