name: Apply Incarnate 0.9 dev4 runtime fixes

on:
  push:
    branches:
      - dev/0.9.0-warden-mob-expansion
    paths:
      - .github/workflows/dev-apply-090-dev4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'
      - name: Apply runtime fixes
        run: python3 .github/scripts/apply_090_dev4.py
      - name: Verify Java 25 build
        run: gradle clean test classes --stacktrace --warning-mode all
      - name: Commit source changes only
        shell: bash
        run: |
          git config user.name Onelsey
          git config user.email 103017546+Wandraker@users.noreply.github.com
          git add build.gradle.kts \
            CHANGELOG.md \
            src/main/resources/plugin.yml \
            src/main/resources/config.yml \
            src/main/java/dev/onelsey/incarnate/config/ConfigMigrator.java \
            src/main/java/dev/onelsey/incarnate/input/SpectatorPrimaryInputBridge.java \
            src/main/java/dev/onelsey/incarnate/listener/SessionListener.java \
            src/main/java/dev/onelsey/incarnate/vision/WardenVisionManager.java \
            src/main/java/dev/onelsey/incarnate/ability/AbilityRegistry.java \
            src/test/java/dev/onelsey/incarnate/config/ConfigMigratorTest.java \
            src/test/java/dev/onelsey/incarnate/message/MessageResourcesTest.java \
            src/test/java/dev/onelsey/incarnate/input/SpectatorPrimaryInputBridgeTest.java
          git commit -m "Fix spectator F and stabilize Warden vision"
          git push origin HEAD:dev/0.9.0-warden-mob-expansion
