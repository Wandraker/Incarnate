name: Apply Incarnate 0.7.1 camera resync

on:
  push:
    branches: [ hotfix/0.7.1-dragon-control ]
    paths: [ '.github/workflows/apply-071-camera-resync.yml' ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: hotfix/0.7.1-dragon-control
      - name: Apply Dragon camera resync
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/camera.patch
          git apply --check /tmp/camera.patch
          git apply /tmp/camera.patch
          rm .github/workflows/apply-071-camera-resync.yml
          git add -A
          git diff --cached --check
          git config user.name Onelsey
          git config user.email '103017546+Wandraker@users.noreply.github.com'
          git commit -m 'Resync mounted Dragon camera orientation'
          git push origin HEAD:hotfix/0.7.1-dragon-control
