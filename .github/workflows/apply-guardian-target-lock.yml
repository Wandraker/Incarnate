name: Apply Guardian target lock

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Apply Guardian target lock
        run: python3 tools/apply_guardian_target_lock.py

      - name: Commit Guardian target lock
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'Onelsey'
          git config user.email '103017546+Wandraker@users.noreply.github.com'
          git add src/main/java/dev/onelsey/incarnate/possession/PossessionSession.java src/main/java/dev/onelsey/incarnate/ability/AbilityRegistry.java
          git commit -m 'Lock native Guardian laser target [skip ci]'
          git push
