name: Apply Incarnate 0.4.0

on:
  push:
    paths:
      - 'tools/apply_040.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply exact 0.4.0 patch
        run: python tools/apply_040.py
      - name: Commit 0.4.0
        run: |
          git config user.name "Onelsey"
          git config user.email "103017546+Wandraker@users.noreply.github.com"
          git add build.gradle.kts README.md CHANGELOG.md src
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "Build Incarnate 0.4.0 mob identity update"
          git push origin HEAD:main
