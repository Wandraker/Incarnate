name: Apply Incarnate 0.9.0 dev6

on:
  push:
    branches: [ dev/0.9.0-warden-mob-expansion ]
    paths:
      - '.github/scripts/apply_090_dev6.py'
      - '.github/workflows/dev6-adventure-possession.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v7
        with:
          ref: dev/0.9.0-warden-mob-expansion
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Apply Adventure controller architecture
        run: python .github/scripts/apply_090_dev6.py

      - name: Test and build
        run: gradle clean test classes jar --stacktrace --warning-mode all

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/apply_090_dev6.py .github/workflows/dev6-adventure-possession.yml
          git config user.name 'Onelsey'
          git config user.email '103017546+Wandraker@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Use Adventure controller isolation for possession'
          git push origin HEAD:dev/0.9.0-warden-mob-expansion
