name: Warden vision phase one

on:
  push:
    branches:
      - dev/0.9.0-warden-mob-expansion
    paths:
      - .github/workflows/warden-vision-phase1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev/0.9.0-warden-mob-expansion
      - name: Apply Warden vision integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          plugin = Path('src/main/java/dev/onelsey/incarnate/IncarnatePlugin.java')
          text = plugin.read_text(encoding='utf-8')
          text = text.replace('import dev.onelsey.incarnate.visibility.PossessionVisibilityManager;\n', 'import dev.onelsey.incarnate.visibility.PossessionVisibilityManager;\nimport dev.onelsey.incarnate.vision.WardenVisionManager;\n')
          text = text.replace('    private SpectatorPrimaryInputBridge spectatorPrimaryInputBridge;\n', '    private SpectatorPrimaryInputBridge spectatorPrimaryInputBridge;\n    private WardenVisionManager wardenVision;\n')
          text = text.replace('        PrimaryInputDeduplicator primaryInputDeduplicator = new PrimaryInputDeduplicator();\n        SecondaryInputDeduplicator secondaryInputDeduplicator = new SecondaryInputDeduplicator();\n        SessionListener sessionListener = new SessionListener(\n            this,\n            possessions,\n            primaryInputDeduplicator,\n            secondaryInputDeduplicator\n        );\n', '        PrimaryInputDeduplicator primaryInputDeduplicator = new PrimaryInputDeduplicator();\n        SecondaryInputDeduplicator secondaryInputDeduplicator = new SecondaryInputDeduplicator();\n        wardenVision = new WardenVisionManager(this);\n        SessionListener sessionListener = new SessionListener(\n            this,\n            possessions,\n            primaryInputDeduplicator,\n            secondaryInputDeduplicator,\n            wardenVision\n        );\n')
          text = text.replace('    public void onDisable() {\n        if (spectatorPrimaryInputBridge != null) {\n', '    public void onDisable() {\n        if (wardenVision != null) {\n            wardenVision.stop();\n        }\n        if (spectatorPrimaryInputBridge != null) {\n')
          plugin.write_text(text, encoding='utf-8')

          listener = Path('src/main/java/dev/onelsey/incarnate/listener/SessionListener.java')
          text = listener.read_text(encoding='utf-8')
          text = text.replace('import dev.onelsey.incarnate.possession.ReleaseReason;\n', 'import dev.onelsey.incarnate.possession.ReleaseReason;\nimport dev.onelsey.incarnate.vision.WardenVisionManager;\n')
          text = text.replace('import io.papermc.paper.event.player.PlayerTrackEntityEvent;\n', 'import io.papermc.paper.event.player.PlayerTrackEntityEvent;\nimport io.papermc.paper.event.player.PlayerUntrackEntityEvent;\n')
          text = text.replace('    private final SecondaryInputDeduplicator secondaryInputDeduplicator;\n', '    private final SecondaryInputDeduplicator secondaryInputDeduplicator;\n    private final WardenVisionManager wardenVision;\n')
          text = text.replace('        PossessionManager possessions,\n        PrimaryInputDeduplicator primaryInputDeduplicator,\n        SecondaryInputDeduplicator secondaryInputDeduplicator\n    ) {\n        this.possessions = possessions;\n        this.primaryInputDeduplicator = primaryInputDeduplicator;\n        this.secondaryInputDeduplicator = secondaryInputDeduplicator;\n', '        PossessionManager possessions,\n        PrimaryInputDeduplicator primaryInputDeduplicator,\n        SecondaryInputDeduplicator secondaryInputDeduplicator,\n        WardenVisionManager wardenVision\n    ) {\n        this.possessions = possessions;\n        this.primaryInputDeduplicator = primaryInputDeduplicator;\n        this.secondaryInputDeduplicator = secondaryInputDeduplicator;\n        this.wardenVision = wardenVision;\n')
          old = '''    @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = false)
    public void onGameModeChange(PlayerGameModeChangeEvent event) {
        PossessionSession session = possessions.session(event.getPlayer());
        if (session != null && session.isActive() && event.getNewGameMode() != org.bukkit.GameMode.SPECTATOR) {
            event.setCancelled(true);
        }
    }
'''
          new = '''    @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = false)
    public void onGameModeChange(PlayerGameModeChangeEvent event) {
        PossessionSession session = possessions.session(event.getPlayer());
        if (session != null && session.isActive()) {
            if (event.getNewGameMode() != org.bukkit.GameMode.SPECTATOR) {
                event.setCancelled(true);
                return;
            }
            wardenVision.ensureActive(session);
            return;
        }
        wardenVision.deactivate(event.getPlayer(), true);
    }
'''
          if old not in text:
              raise SystemExit('game mode block not found')
          text = text.replace(old, new)
          old = '''    @EventHandler(priority = EventPriority.MONITOR, ignoreCancelled = true)
    public void onInput(PlayerInputEvent event) {
        possessions.updateInput(event.getPlayer(), InputSnapshot.from(event.getInput()));
    }
'''
          new = '''    @EventHandler(priority = EventPriority.MONITOR, ignoreCancelled = true)
    public void onInput(PlayerInputEvent event) {
        PossessionSession session = possessions.session(event.getPlayer());
        if (session != null && session.isActive()) {
            wardenVision.ensureActive(session);
        }
        possessions.updateInput(event.getPlayer(), InputSnapshot.from(event.getInput()));
    }
'''
          text = text.replace(old, new)
          old = '''    @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = false)
    public void onTrackEntity(PlayerTrackEntityEvent event) {
        if (event.getEntity() instanceof Player controller
            && possessions.isControllerConcealed(controller.getUniqueId())
            && !event.getPlayer().getUniqueId().equals(controller.getUniqueId())) {
            event.setCancelled(true);
        }
    }
'''
          new = '''    @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = false)
    public void onTrackEntity(PlayerTrackEntityEvent event) {
        if (event.getEntity() instanceof Player controller
            && possessions.isControllerConcealed(controller.getUniqueId())
            && !event.getPlayer().getUniqueId().equals(controller.getUniqueId())) {
            event.setCancelled(true);
            return;
        }

        PossessionSession session = possessions.session(event.getPlayer());
        if (session != null && session.isActive()
            && wardenVision.filterTrack(session, event.getPlayer(), event.getEntity())) {
            event.setCancelled(true);
        }
    }

    @EventHandler(priority = EventPriority.MONITOR)
    public void onUntrackEntity(PlayerUntrackEntityEvent event) {
        wardenVision.onUntrack(event.getPlayer(), event.getEntity());
    }
'''
          if old not in text:
              raise SystemExit('track block not found')
          text = text.replace(old, new)
          old = '''    @EventHandler
    public void onControllerDeath(PlayerDeathEvent event) {
        possessions.releaseOnControllerDeath(event.getEntity());
    }
'''
          new = '''    @EventHandler
    public void onControllerDeath(PlayerDeathEvent event) {
        wardenVision.deactivate(event.getEntity(), false);
        possessions.releaseOnControllerDeath(event.getEntity());
    }
'''
          text = text.replace(old, new)
          old = '''    @EventHandler
    public void onQuit(PlayerQuitEvent event) {
        primaryInputDeduplicator.clear(event.getPlayer().getUniqueId());
        secondaryInputDeduplicator.clear(event.getPlayer().getUniqueId());
        possessions.releaseOnQuit(event.getPlayer());
    }
'''
          new = '''    @EventHandler
    public void onQuit(PlayerQuitEvent event) {
        primaryInputDeduplicator.clear(event.getPlayer().getUniqueId());
        secondaryInputDeduplicator.clear(event.getPlayer().getUniqueId());
        wardenVision.deactivate(event.getPlayer(), false);
        possessions.releaseOnQuit(event.getPlayer());
    }
'''
          if old not in text:
              raise SystemExit('quit block not found')
          text = text.replace(old, new)
          listener.write_text(text, encoding='utf-8')

          migrator = Path('src/main/java/dev/onelsey/incarnate/config/ConfigMigrator.java')
          text = migrator.read_text(encoding='utf-8')
          if 'private static final int CURRENT_SCHEMA = 5;' not in text:
              raise SystemExit('schema 5 not found')
          migrator.write_text(text.replace('private static final int CURRENT_SCHEMA = 5;', 'private static final int CURRENT_SCHEMA = 6;'), encoding='utf-8')

          config = Path('src/main/resources/config.yml')
          text = config.read_text(encoding='utf-8')
          if not text.startswith('config-version: 5'):
              raise SystemExit('config schema header not found')
          text = text.replace('config-version: 5', 'config-version: 6', 1)
          marker = '''senses:
  warden:
    enabled: true
    max-range: 32.0
    memory-ticks: 40
    ignore-self: true
    show-event-kind: true

'''
          addition = marker + '''vision:
  warden:
    enabled: true
    entity-hard-limit: 12.0
    evaluation-interval-ticks: 2
    watch-prune-distance: 256.0
    visual-darkness: true
    visual-refresh-ticks: 100

'''
          if marker not in text:
              raise SystemExit('warden senses config marker not found')
          config.write_text(text.replace(marker, addition, 1), encoding='utf-8')

          build = Path('build.gradle.kts')
          text = build.read_text(encoding='utf-8')
          if 'version = "0.8.1-alpha.4"' not in text:
              raise SystemExit('build alpha4 version not found')
          build.write_text(text.replace('version = "0.8.1-alpha.4"', 'version = "0.9.0-dev.1"'), encoding='utf-8')

          meta = Path('src/main/resources/plugin.yml')
          text = meta.read_text(encoding='utf-8')
          if 'version: 0.8.1-alpha.4' not in text:
              raise SystemExit('plugin alpha4 version not found')
          meta.write_text(text.replace('version: 0.8.1-alpha.4', 'version: 0.9.0-dev.1'), encoding='utf-8')

          Path('.github/workflows/warden-vision-phase1.yml').unlink()
          PY
          git config user.name Onelsey
          git config user.email 103017546+Wandraker@users.noreply.github.com
          git add -A
          git commit -m "Add Warden constrained vision foundation"
          git push origin HEAD:dev/0.9.0-warden-mob-expansion
