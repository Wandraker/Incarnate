name: Apply Incarnate 0.9.0 dev7

on:
  push:
    branches: [ dev/0.9.0-warden-mob-expansion ]
    paths:
      - '.github/scripts/apply_090_dev7.py'
      - '.github/workflows/dev7-direct-camera.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Apply dev7 patch
        run: python .github/scripts/apply_090_dev7.py

      - name: Validate source
        run: gradle clean test classes jar --stacktrace --warning-mode all

      - name: Commit clean dev7 source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/apply_090_dev7.py
          rm .github/workflows/dev7-direct-camera.yml
          git config user.name "Onelsey"
          git config user.email "103017546+Wandraker@users.noreply.github.com"
          git add -A
          git commit -m "Use native entity camera for possession"
          git push
