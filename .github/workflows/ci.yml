name: Apply Incarnate 0.9 development patch

on:
  push:
    branches:
      - dev/0.9.0-warden-mob-expansion
    paths:
      - .github/workflows/ci.yml
      - .github/scripts/**

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 12
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'
      - name: Apply source patch
        shell: bash
        run: |
          python3 .github/scripts/apply_090.py
          python3 .github/scripts/fix_090_test.py
          python3 .github/scripts/fix_090_config_test.py
      - name: Verify Java 25 build
        run: gradle clean test classes --stacktrace --warning-mode all
      - name: Commit source changes only
        shell: bash
        run: |
          git config user.name Onelsey
          git config user.email 103017546+Wandraker@users.noreply.github.com
          git add build.gradle.kts \
            src/main/resources/plugin.yml \
            src/main/resources/config.yml \
            src/main/java/dev/onelsey/incarnate/config/ConfigMigrator.java \
            src/main/java/dev/onelsey/incarnate/sense/WardenSenseSnapshot.java \
            src/main/java/dev/onelsey/incarnate/possession/PossessionSession.java \
            src/main/java/dev/onelsey/incarnate/possession/PossessionManager.java \
            src/main/java/dev/onelsey/incarnate/possession/VesselState.java \
            src/main/java/dev/onelsey/incarnate/possession/VesselRecoveryStore.java \
            src/main/java/dev/onelsey/incarnate/ability/AbilityRegistry.java \
            src/main/java/dev/onelsey/incarnate/ability/WardenSonicMath.java \
            src/test/java/dev/onelsey/incarnate/ability/WardenSonicMathTest.java \
            src/test/java/dev/onelsey/incarnate/config/ConfigMigratorTest.java \
            src/test/java/dev/onelsey/incarnate/message/MessageResourcesTest.java \
            src/test/java/dev/onelsey/incarnate/sense/WardenSenseMathTest.java
          git commit -m "Add Warden sonic control and Ghast attack fidelity"
          git push origin HEAD:dev/0.9.0-warden-mob-expansion
