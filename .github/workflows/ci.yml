name: Java 25 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: incarnate-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Compile against Paper 26.2
        run: gradle clean classes --stacktrace --warning-mode all

  paper-smoke:
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Build temporary plugin jar
        run: gradle clean jar --stacktrace --warning-mode all

      - name: Download Paper 26.2 build 121
        shell: bash
        run: |
          set -euo pipefail
          USER_AGENT='Incarnate-CI/0.1.0 (GitHub Actions)'
          BUILDS=$(curl -fsSL -H "User-Agent: ${USER_AGENT}" 'https://fill.papermc.io/v3/projects/paper/versions/26.2/builds')
          PAPER_URL=$(printf '%s' "$BUILDS" | jq -r 'first(.[] | select(.id == 121) | .downloads."server:default".url) // empty')
          test -n "$PAPER_URL"
          curl -fsSL -H "User-Agent: ${USER_AGENT}" -o paper.jar "$PAPER_URL"

      - name: Verify Paper startup and shutdown lifecycle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-server/plugins
          cp build/libs/Incarnate-0.1.0.jar ci-server/plugins/Incarnate.jar
          cp paper.jar ci-server/paper.jar
          printf 'eula=true\n' > ci-server/eula.txt
          mkfifo ci-server/server-input
          exec 3<>ci-server/server-input

          cd ci-server
          java -Xms768M -Xmx1536M -jar paper.jar --nogui < server-input > ../paper-smoke.log 2>&1 &
          SERVER_PID=$!
          cd ..

          cleanup() {
            exec 3>&- 2>/dev/null || true
            if kill -0 "$SERVER_PID" 2>/dev/null; then
              kill -TERM "$SERVER_PID" 2>/dev/null || true
              sleep 2
            fi
            if kill -0 "$SERVER_PID" 2>/dev/null; then
              kill -KILL "$SERVER_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 100); do
            if grep -Eq 'Done \([^)]*\)! For help, type "help"' paper-smoke.log 2>/dev/null \
              && grep -Fq 'Incarnate 0.1.0 enabled for Minecraft 26.2+' paper-smoke.log 2>/dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo 'Paper exited before startup completed.'
              cat paper-smoke.log || true
              exit 1
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo 'Timed out waiting for Paper and Incarnate startup.'
            cat paper-smoke.log || true
            exit 1
          fi

          printf 'stop\n' >&3
          exec 3>&-

          STOPPED=0
          for _ in $(seq 1 45); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              STOPPED=1
              break
            fi
            sleep 1
          done

          if [ "$STOPPED" -ne 1 ]; then
            echo 'Paper did not stop cleanly after the stop command.'
            cat paper-smoke.log || true
            exit 1
          fi

          wait "$SERVER_PID" || true
          trap - EXIT
          cat paper-smoke.log

          grep -F 'Incarnate 0.1.0 enabled for Minecraft 26.2+' paper-smoke.log
          grep -F 'Disabling Incarnate v0.1.0' paper-smoke.log

          if grep -E 'Error occurred while enabling Incarnate|Error occurred while disabling Incarnate|Could not load.*Incarnate|Exception.*Incarnate|IllegalPluginAccessException' paper-smoke.log; then
            exit 1
          fi
