config-version: 5

control:
  max-possession-distance: 8.0
  release-at-vessel: true

camera:
  mode: MOUNTED
  mount-retries: 8
  fallback-to-spectator-target: true

hud:
  actionbar:
    enabled: true
    interval-ticks: 4
    show-health: true
    show-abilities: true
    show-senses: true

release-key:
  shift-swap-offhand: true
  spectator-shift-latch-ms: 650

secondary-key:
  swap-offhand: true

input:
  gestures:
    sneak-primary: true
    sprint-primary: true

senses:
  warden:
    enabled: true
    max-range: 32.0
    memory-ticks: 40
    ignore-self: true
    show-event-kind: true

admin:
  inspect-distance: 12.0

visibility:
  hide-controller-from-tab: true

created-vessels:
  remove-on-release: true
  remove-orphaned-after-recovery: true

movement:
  ground:
    fallback-walk-speed: 0.24
    attribute-scale: 1.0
    minimum-walk-speed: 0.06
    maximum-walk-speed: 0.55
    sprint-multiplier: 1.30
    air-control: 0.35
    fallback-jump-velocity: 0.42
    preserve-existing-vertical-velocity: true
    hurt-input-control: 0.25
    idle-horizontal-damping: 0.65
  flight:
    speed: 0.34
    attribute-scale: 1.0
    minimum-speed: 0.12
    maximum-speed: 0.65
    sprint-multiplier: 1.35
    acceleration: 0.55
    idle-damping: 0.72
    hurt-input-control: 0.30
  aquatic:
    speed: 0.27
    sprint-multiplier: 1.25
    acceleration: 0.45
    idle-damping: 0.82
    beached-hop-velocity: 0.28
    hurt-input-control: 0.35
  hopping:
    hop-interval-ticks: 5
    jump-multiplier: 1.0
    sprint-multiplier: 1.20
    air-control: 0.20
    idle-horizontal-damping: 0.70
    hurt-input-control: 0.25
  climbing:
    climb-velocity: 0.24
    wall-probe-distance: 0.45
  cube:
    speed: 0.23
    sprint-multiplier: 1.25
    base-hop-velocity: 0.42
    size-hop-bonus: 0.015
    hop-interval-ticks: 6
    idle-damping: 0.72
    hurt-input-control: 0.25
  dragon:
    speed: 0.48
    sprint-multiplier: 1.35
    acceleration: 0.42
    idle-damping: 0.78
    hurt-input-control: 0.35
  shulker:
    step-interval-ticks: 5
    allow-vertical-wall-crawl: true

