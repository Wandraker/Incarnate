name: Incarnate
version: 0.9.0-dev.9
main: dev.onelsey.incarnate.IncarnatePlugin
api-version: '26.2'
authors: [Onelsey]
description: True mob incarnation and possession using real server entities and native abilities.
folia-supported: true
commands:
  incarnate:
    description: Create a real mob body, trigger abilities, or inspect a controlled vessel.
    usage: /incarnate <mob|primary|secondary|inspect>
  possess:
    description: Possess the real mob you are looking at.
    usage: /possess
  release:
    description: Leave the current vessel or retry a pending recovery.
    usage: /release
permissions:
  incarnate.use.incarnate:
    description: Allows creating a vessel, subject to per-mob permissions.
    default: false
  incarnate.use.possess:
    description: Allows possessing an existing mob, subject to per-mob permissions.
    default: false
  incarnate.mob.*:
    description: Allows every supported Incarnate mob type.
    default: false
  incarnate.admin.inspect:
    description: Allows inspecting which player controls an Incarnate vessel.
    default: op
